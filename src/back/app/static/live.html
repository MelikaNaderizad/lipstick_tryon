<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>پیش‌نمایش لایو رژ لب</title>
    <style>
      :root {
        --bg: #f6f4f5;
        --card: #fff;
        --ink: #222;
        --mut: #777;
        --line: #e3dfe1;
        --pink: #c2185b;
        --ok: #2e7d32;
        --bad: #c62828;
      }
      * {
        box-sizing: border-box;
      }
      body {
        font-family: Tahoma, sans-serif;
        background: var(--bg);
        color: var(--ink);
        margin: 0;
        padding: 20px;
      }
      .wrap {
        max-width: 640px;
        margin: 0 auto;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 4px;
      }
      h2 {
        font-size: 15px;
        margin: 0 0 10px;
      }
      .sub {
        color: var(--mut);
        font-size: 13px;
        margin-bottom: 18px;
        line-height: 1.8;
      }
      .panel {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 16px;
        margin-bottom: 16px;
      }
      .row {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        align-items: center;
        margin-bottom: 8px;
      }
      label {
        font-size: 13px;
        color: var(--mut);
      }
      input[type="text"] {
        padding: 7px 9px;
        border: 1px solid var(--line);
        border-radius: 6px;
        font-family: inherit;
        font-size: 13px;
        direction: ltr;
      }
      button {
        padding: 7px 14px;
        border: 1px solid var(--line);
        background: #fff;
        border-radius: 6px;
        cursor: pointer;
        font-family: inherit;
        font-size: 13px;
      }
      button.primary {
        background: var(--pink);
        border-color: var(--pink);
        color: #fff;
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .chip {
        width: 40px;
        height: 40px;
        border-radius: 8px;
        border: 1px solid var(--line);
        flex: none;
        cursor: pointer;
      }
      .chip.selected {
        outline: 2px solid var(--pink);
        outline-offset: 2px;
      }
      .status {
        font-size: 12px;
        margin-top: 6px;
        min-height: 18px;
      }
      .err {
        color: var(--bad);
      }
      .good {
        color: var(--ok);
      }
      #stage {
        position: relative;
        border-radius: 10px;
        overflow: hidden;
        background: #111;
      }
      #outCanvas {
        width: 100%;
        display: block;
      } /* نمایش آینه‌ای؛ فریم ارسالی به سرور آینه نیست */
      video {
        display: none;
      }
      .hint {
        font-size: 12px;
        color: var(--mut);
        line-height: 1.8;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>پیش‌نمایش لایو رژ لب</h1>
      <div class="sub">
        لندمارک لب و ترکیب رنگ کاملاً سمت بک‌اند (Python + MediaPipe) انجام
        می‌شه؛ هر فریم از دوربین به سرور می‌ره، رنگ‌شده برمی‌گرده و همینجا نمایش
        داده می‌شه. این صفحه‌ی موقتیه؛ بعداً با فرانت اصلی جایگزین می‌شه.
      </div>

      <div class="panel">
        <h2>رنگ</h2>
        <div class="row" id="colorPicker"></div>
        <div class="row">
          <label>رنگ دستی</label>
          <input type="text" id="manualColor" placeholder="#B0223A" />
        </div>
      </div>

      <div class="panel">
        <div class="row">
          <button id="startBtn" class="primary">فعال کردن دوربین</button>
          <button id="stopBtn" disabled>خاموش کردن دوربین</button>
          <span class="status" id="status"></span>
        </div>
        <div id="stage">
          <video id="video" autoplay playsinline muted></video>
          <canvas id="outCanvas"></canvas>
        </div>
        <div class="hint">
          اگه چهره‌ای پیدا نشه، همون فریم خام بدون تغییر نمایش داده می‌شه.
        </div>
      </div>
    </div>

    <script>
      "use strict";
      var video = document.getElementById("video");
      var outCanvas = document.getElementById("outCanvas");
      var outCtx = outCanvas.getContext("2d");
      var startBtn = document.getElementById("startBtn");
      var stopBtn = document.getElementById("stopBtn");
      var statusEl = document.getElementById("status");
      var manualColor = document.getElementById("manualColor");
      var colorPicker = document.getElementById("colorPicker");

      var CAPTURE_W = 480; // رزولوشن فریم ارسالی به سرور؛ بزرگ‌تر = دقیق‌تر ولی کندتر
      var captureCanvas = document.createElement("canvas");
      var captureCtx = captureCanvas.getContext("2d");

      var ws = null;
      var stream = null;
      var running = false;
      var waitingResponse = false;
      var currentColor = "#B0223A";

      function setStatus(text, kind) {
        statusEl.textContent = text || "";
        statusEl.className = "status " + (kind || "");
      }

      function wsUrl() {
        var proto = location.protocol === "https:" ? "wss:" : "ws:";
        return proto + "//" + location.host + "/ws/live-tryon";
      }

      function sendColor(hex) {
        currentColor = hex;
        if (ws && ws.readyState === 1)
          ws.send(JSON.stringify({ target_color: hex }));
      }

      async function loadShades() {
        try {
          var shades = await fetch("/demo/shades").then(function (r) {
            return r.json();
          });
          colorPicker.innerHTML = "";
          if (!shades.length) {
            var empty = document.createElement("span");
            empty.className = "hint";
            empty.textContent = "هنوز رنگ تأییدشده‌ای ثبت نشده.";
            colorPicker.appendChild(empty);
            return;
          }
          shades.forEach(function (s, i) {
            var chip = document.createElement("div");
            chip.className = "chip";
            chip.style.background = s.base_pigment_color;
            chip.title = s.name + " " + s.base_pigment_color;
            chip.onclick = function () {
              Array.prototype.forEach.call(colorPicker.children, function (n) {
                n.classList && n.classList.remove("selected");
              });
              chip.classList.add("selected");
              manualColor.value = s.base_pigment_color;
              sendColor(s.base_pigment_color);
            };
            colorPicker.appendChild(chip);
            if (i === 0) {
              chip.classList.add("selected");
              manualColor.value = s.base_pigment_color;
              currentColor = s.base_pigment_color;
            }
          });
        } catch (e) {
          setStatus("اتصال به بک‌اند برقرار نشد: " + e.message, "err");
        }
      }
      manualColor.addEventListener("change", function () {
        var v = manualColor.value.trim();
        if (/^#[0-9A-Fa-f]{6}$/.test(v)) sendColor(v);
      });

      function connectWs() {
        ws = new WebSocket(wsUrl());
        ws.binaryType = "blob";
        ws.onopen = function () {
          sendColor(currentColor);
        };
        ws.onmessage = function (ev) {
          waitingResponse = false;
          var url = URL.createObjectURL(ev.data);
          var img = new Image();
          img.onload = function () {
            if (
              outCanvas.width !== img.width ||
              outCanvas.height !== img.height
            ) {
              outCanvas.width = img.width;
              outCanvas.height = img.height;
            }
            outCtx.drawImage(img, 0, 0);
            URL.revokeObjectURL(url);
          };
          img.src = url;
        };
        ws.onerror = function () {
          setStatus("خطا در اتصال WebSocket", "err");
        };
        ws.onclose = function () {
          if (running) setStatus("اتصال به سرور قطع شد.", "err");
        };
      }

      function captureLoop() {
        if (!running) return;
        // backpressure: فریم بعدی فقط بعد از رسیدن جواب فریم قبلی فرستاده می‌شه
        // تا صف رو شبکه/سرور جمع نشه.
        if (!waitingResponse && ws && ws.readyState === 1 && video.videoWidth) {
          var w = CAPTURE_W,
            h = Math.round((CAPTURE_W * video.videoHeight) / video.videoWidth);
          captureCanvas.width = w;
          captureCanvas.height = h;
          captureCtx.drawImage(video, 0, 0, w, h);
          captureCanvas.toBlob(
            function (blob) {
              if (blob && ws && ws.readyState === 1) {
                ws.send(blob);
                waitingResponse = true;
              }
            },
            "image/jpeg",
            0.8,
          );
        }
        requestAnimationFrame(captureLoop);
      }

      async function start() {
        startBtn.disabled = true;
        try {
          setStatus("در حال فعال‌سازی دوربین…");
          stream = await navigator.mediaDevices.getUserMedia({
            video: { width: 640, height: 480 },
          });
          video.srcObject = stream;
          await new Promise(function (resolve) {
            video.onloadedmetadata = resolve;
          });
          await video.play();
          connectWs();
          running = true;
          stopBtn.disabled = false;
          setStatus("");
          requestAnimationFrame(captureLoop);
        } catch (e) {
          setStatus("دسترسی به دوربین ناموفق بود: " + e.message, "err");
          startBtn.disabled = false;
        }
      }
      function stop() {
        running = false;
        stopBtn.disabled = true;
        startBtn.disabled = false;
        if (ws) {
          ws.close();
          ws = null;
        }
        if (stream) {
          stream.getTracks().forEach(function (t) {
            t.stop();
          });
          stream = null;
        }
        outCtx.clearRect(0, 0, outCanvas.width, outCanvas.height);
        setStatus("دوربین خاموش شد.");
      }
      startBtn.addEventListener("click", start);
      stopBtn.addEventListener("click", stop);
      window.addEventListener("beforeunload", stop);
      loadShades();
    </script>
  </body>
</html>
