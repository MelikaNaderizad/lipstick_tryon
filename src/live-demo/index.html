<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<title>دموی زنده‌ی Try-On رژ لب</title>
<style>
  body {
    font-family: Tahoma, sans-serif;
    background: #111;
    color: #eee;
    margin: 0;
    padding: 20px;
  }
  h2 { margin-bottom: 4px; text-align: center; }
  .sub { color: #999; margin-bottom: 20px; font-size: 13px; text-align: center; }

  .api-box {
    max-width: 480px;
    margin: 0 auto 16px auto;
    display: flex;
    gap: 8px;
    align-items: center;
    justify-content: center;
    font-size: 12px;
  }
  .api-box input {
    flex: 1;
    background: #1b1b1b;
    border: 1px solid #333;
    color: #eee;
    padding: 6px 10px;
    border-radius: 6px;
  }
  .api-box button {
    padding: 6px 14px;
    border-radius: 6px;
    border: 1px solid #444;
    background: #222;
    color: #eee;
    cursor: pointer;
  }

  .panel {
    max-width: 900px;
    margin: 0 auto 16px auto;
    background: #1b1b1b;
    padding: 14px 16px;
    border-radius: 8px;
  }
  .panel-title { font-size: 13px; color: #aaa; margin-bottom: 10px; }
  .row {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
  }

  .shade-btn {
    width: 60px;
    height: 60px;
    border-radius: 8px;
    border: 2px solid transparent;
    cursor: pointer;
    position: relative;
  }
  .shade-btn.selected { border-color: #6cf; }
  .shade-btn span {
    position: absolute;
    bottom: -20px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 10px;
    color: #aaa;
    white-space: nowrap;
  }

  .anchor-btn {
    width: 46px;
    height: 46px;
    border-radius: 8px;
    border: 2px solid transparent;
    cursor: pointer;
    position: relative;
  }
  .anchor-btn.selected { border-color: #6cf; }
  .anchor-btn span {
    position: absolute;
    bottom: -18px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 9px;
    color: #aaa;
    white-space: nowrap;
  }

  .stage {
    max-width: 680px;
    margin: 0 auto;
    position: relative;
  }
  video { display: none; }
  canvas {
    width: 100%;
    border-radius: 8px;
    background: #000;
  }

  #status {
    text-align: center;
    margin-top: 14px;
    font-size: 13px;
    color: #6cf;
    min-height: 18px;
  }
  .start-btn {
    display: block;
    margin: 16px auto;
    padding: 10px 24px;
    border-radius: 24px;
    border: none;
    background: #2a6;
    color: #fff;
    font-size: 14px;
    cursor: pointer;
  }
  .start-btn:disabled { background: #444; cursor: not-allowed; }
</style>
</head>
<body>

<h2>دموی زنده‌ی Virtual Try-On</h2>
<div class="sub">رنگ‌های تأییدشده‌ی خودت از دیتابیس میان (اول توی /review آپلود و تأیید کن)</div>

<div class="api-box">
  <span>آدرس بک‌اند:</span>
  <input type="text" id="apiBase" value="http://localhost:8000">
  <button id="reloadBtn">بارگذاری مجدد</button>
</div>

<div class="panel">
  <div class="panel-title">۱. انتخاب رنگ</div>
  <div class="row" id="shadeRow"><span style="font-size:12px;color:#888;">در حال بارگذاری...</span></div>
</div>

<div class="panel">
  <div class="panel-title">۲. تناژ پوست (اختیاری — پیش‌فرض: از خودِ دوربین)</div>
  <div class="row" id="anchorRow"></div>
</div>

<div class="stage">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>
</div>

<button class="start-btn" id="startBtn">فعال کردن دوربین</button>
<div id="status">اول بک‌اند رو بالا بیار (docker-compose up)، بعد دوربین رو فعال کن.</div>

<script type="module">
import {
  FaceLandmarker,
  FilesetResolver,
} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

const apiBaseInput = document.getElementById("apiBase");
const reloadBtn = document.getElementById("reloadBtn");
const shadeRow = document.getElementById("shadeRow");
const anchorRow = document.getElementById("anchorRow");
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const startBtn = document.getElementById("startBtn");
const statusEl = document.getElementById("status");

// همون فرمول blend.py بک‌اند — باید هماهنگ نگه داشته بشه
const BASE_OPACITY = 0.85;
// معادل feather_px توی app/lip_apply.py — لبه‌ی ماسک رو نرم می‌کنه تا مرز لب
// تیز/بریده به‌نظر نرسه (روی عکس‌های ثابت این کار با GaussianBlur انجام می‌شد).
const FEATHER_PX = 4;

const LIPS_OUTER = [61,185,40,39,37,0,267,269,270,409,291,375,321,405,314,17,84,181,91,146,61];
const LIPS_INNER = [78,191,80,81,82,13,312,311,310,415,308,324,318,402,317,14,87,178,88,95,78];

let faceLandmarker = null;
let shades = [];
let anchors = [];
let selectedShade = null;
let selectedAnchor = null; // null = رنگ زنده از روی پیکسل واقعی لب
let cameraRunning = false;
let maskCanvas = null, maskCtx = null;

function srgbToLinear(c) {
  c = c / 255;
  return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
}
function linearToSrgb(c) {
  c = Math.max(0, Math.min(1, c));
  const s = c <= 0.0031308 ? c * 12.92 : 1.055 * Math.pow(c, 1 / 2.4) - 0.055;
  return Math.round(Math.max(0, Math.min(1, s)) * 255);
}
function hexToRgb(hex) {
  const v = parseInt(hex.replace("#", ""), 16);
  return { r: (v >> 16) & 255, g: (v >> 8) & 255, b: v & 255 };
}

// ---------- تبدیل CIE Lab <-> sRGB (D65) ----------
// دقیقاً همون فضای رنگی که color_lab.py از OpenCV بازیابی می‌کنه (نه RGB خام).
const _XN = 0.95047, _YN = 1.0, _ZN = 1.08883;
function _fLab(t) {
  const d = 6 / 29;
  return t > d * d * d ? Math.cbrt(t) : t / (3 * d * d) + 4 / 29;
}
function _fLabInv(t) {
  const d = 6 / 29;
  return t > d ? t * t * t : 3 * d * d * (t - 4 / 29);
}
function rgbToLab(r, g, b) {
  const rl = srgbToLinear(r), gl = srgbToLinear(g), bl = srgbToLinear(b);
  const x = 0.4124564 * rl + 0.3575761 * gl + 0.1804375 * bl;
  const y = 0.2126729 * rl + 0.7151522 * gl + 0.0721750 * bl;
  const z = 0.0193339 * rl + 0.1191920 * gl + 0.9503041 * bl;
  const fx = _fLab(x / _XN), fy = _fLab(y / _YN), fz = _fLab(z / _ZN);
  return { l: 116 * fy - 16, a: 500 * (fx - fy), b: 200 * (fy - fz) };
}
function labToRgb(l, a, b) {
  const fy = (l + 16) / 116;
  const fx = fy + a / 500;
  const fz = fy - b / 200;
  const x = _fLabInv(fx) * _XN, y = _fLabInv(fy) * _YN, z = _fLabInv(fz) * _ZN;
  const rl =  3.2404542 * x - 1.5371385 * y - 0.4985314 * z;
  const gl = -0.9692660 * x + 1.8760108 * y + 0.0415560 * z;
  const bl =  0.0556434 * x - 0.2040259 * y + 1.0572252 * z;
  return { r: linearToSrgb(rl), g: linearToSrgb(gl), b: linearToSrgb(bl) };
}
function hexToLab(hex) {
  const { r, g, b } = hexToRgb(hex);
  return rgbToLab(r, g, b);
}

async function loadData() {
  const base = apiBaseInput.value.replace(/\/$/, "");
  statusEl.textContent = "در حال گرفتن داده از بک‌اند...";
  try {
    const [shadesRes, anchorsRes] = await Promise.all([
      fetch(`${base}/demo/shades`),
      fetch(`${base}/demo/skin-tone-anchors`),
    ]);
    shades = await shadesRes.json();
    anchors = await anchorsRes.json();
    buildShadeButtons();
    buildAnchorButtons();
    statusEl.textContent = cameraRunning ? "" : "یه رنگ انتخاب کن و دوربین رو فعال کن.";
  } catch (err) {
    statusEl.textContent = "اتصال به بک‌اند برقرار نشد — آدرس رو چک کن (CORS/آدرس/بک‌اند بالا نیست).";
  }
}

function buildShadeButtons() {
  shadeRow.innerHTML = "";
  shades.forEach((shade) => {
    const btn = document.createElement("div");
    btn.className = "shade-btn";
    btn.style.background = shade.base_pigment_color;
    const label = document.createElement("span");
    label.textContent = shade.name;
    btn.appendChild(label);
    btn.addEventListener("click", () => {
      selectedShade = shade;
      document.querySelectorAll(".shade-btn").forEach((b) => b.classList.remove("selected"));
      btn.classList.add("selected");
    });
    shadeRow.appendChild(btn);
  });
  if (shades.length > 0) {
    selectedShade = shades[0];
    shadeRow.firstChild.classList.add("selected");
  } else {
    shadeRow.textContent = "هنوز رنگ تأییدشده‌ای نیست — از /review آپلود و تأیید کن.";
  }
}

function buildAnchorButtons() {
  anchorRow.innerHTML = "";
  anchors.forEach((anchor) => {
    const btn = document.createElement("div");
    btn.className = "anchor-btn";
    btn.style.background = anchor.reference_color;
    const label = document.createElement("span");
    label.textContent = anchor.name;
    btn.appendChild(label);
    btn.addEventListener("click", () => {
      if (selectedAnchor && selectedAnchor.id === anchor.id) {
        selectedAnchor = null;
      } else {
        selectedAnchor = anchor;
      }
      document.querySelectorAll(".anchor-btn").forEach((b) => b.classList.remove("selected"));
      if (selectedAnchor) btn.classList.add("selected");
    });
    anchorRow.appendChild(btn);
  });
}

async function initMediaPipe() {
  const filesetResolver = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
  );
  faceLandmarker = await FaceLandmarker.createFromOptions(filesetResolver, {
    baseOptions: {
      modelAssetPath:
        "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
      delegate: "GPU",
    },
    outputFaceBlendshapes: false,
    outputFacialTransformationMatrixes: false,
    runningMode: "VIDEO",
    numFaces: 1,
  });
}

async function startCamera() {
  startBtn.disabled = true;
  statusEl.textContent = "در حال بارگذاری مدل و فعال‌سازی دوربین...";
  try {
    if (!faceLandmarker) await initMediaPipe();
    const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } });
    video.srcObject = stream;
    await new Promise((resolve) => (video.onloadedmetadata = resolve));
    video.play();
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    cameraRunning = true;
    statusEl.textContent = "";
    requestAnimationFrame(renderLoop);
  } catch (err) {
    statusEl.textContent = "دسترسی به دوربین یا بارگذاری مدل ناموفق بود: " + err.message;
    startBtn.disabled = false;
  }
}

// بیرونی پر (fill) + داخلی با قانون evenodd خالی = فقط خودِ لب. یه بلور کوچیک
// (FEATHER_PX) هم روی خودِ رسم زده می‌شه تا لبه‌ی ماسک تیز/بریده نباشه —
// معادل feather_px (GaussianBlur) توی app/lip_apply.py برای عکس ثابت.
function buildLipsAlphaMask(w, h, landmarks) {
  if (!maskCanvas) { maskCanvas = document.createElement("canvas"); maskCtx = maskCanvas.getContext("2d"); }
  maskCanvas.width = w;
  maskCanvas.height = h;
  maskCtx.clearRect(0, 0, w, h);
  maskCtx.filter = FEATHER_PX > 0 ? `blur(${FEATHER_PX}px)` : "none";
  maskCtx.fillStyle = "#fff";
  maskCtx.beginPath();
  LIPS_OUTER.forEach((idx, i) => {
    const p = landmarks[idx];
    const x = p.x * w, y = p.y * h;
    if (i === 0) maskCtx.moveTo(x, y); else maskCtx.lineTo(x, y);
  });
  maskCtx.closePath();
  LIPS_INNER.forEach((idx, i) => {
    const p = landmarks[idx];
    const x = p.x * w, y = p.y * h;
    if (i === 0) maskCtx.moveTo(x, y); else maskCtx.lineTo(x, y);
  });
  maskCtx.closePath();
  maskCtx.fill("evenodd");
  maskCtx.filter = "none";
  return maskCtx.getImageData(0, 0, w, h).data;
}

function renderLoop() {
  if (!cameraRunning) return;
  const now = performance.now();
  const result = faceLandmarker.detectForVideo(video, now);

  const w = canvas.width, h = canvas.height;
  ctx.drawImage(video, 0, 0, w, h);

  if (result.faceLandmarks && result.faceLandmarks.length > 0 && selectedShade) {
    const landmarks = result.faceLandmarks[0];
    const maskData = buildLipsAlphaMask(w, h, landmarks);
    const frame = ctx.getImageData(0, 0, w, h);
    const data = frame.data;

    // رنگ هدف: یا render_color پیش‌محاسبه‌شده روی Anchor انتخابی، یا خودِ
    // base_pigment_color — در هر دو حالت یک‌بار در فریم به Lab تبدیل می‌شه.
    let targetHex = selectedShade.base_pigment_color;
    if (selectedAnchor) {
      const profile = selectedShade.render_profiles.find(
        (p) => p.skin_tone_anchor_id === selectedAnchor.id
      );
      if (profile) targetHex = profile.render_color;
    }
    const targetLab = hexToLab(targetHex);

    // دقیقاً همون دو ضریب color_lab.py: blend_ratio برای a/b (خودِ رنگ)،
    // l_blend_ratio پایین برای L (تا های‌لایت/بافت طبیعی لب حفظ بشه و
    // نتیجه "تخت" نشه).
    const blendRatio = BASE_OPACITY; // 0.85
    const lBlendRatio = 0.25;

    for (let i = 0; i < data.length; i += 4) {
      const maskAlpha = maskData[i + 3] / 255;
      if (maskAlpha <= 0.003) continue;

      const lab = rgbToLab(data[i], data[i + 1], data[i + 2]);

      const alpha = maskAlpha * blendRatio;
      const newA = lab.a * (1 - alpha) + targetLab.a * alpha;
      const newB = lab.b * (1 - alpha) + targetLab.b * alpha;

      const lAlpha = maskAlpha * blendRatio * lBlendRatio;
      const newL = lab.l * (1 - lAlpha) + targetLab.l * lAlpha;

      const out = labToRgb(newL, newA, newB);
      data[i] = out.r;
      data[i + 1] = out.g;
      data[i + 2] = out.b;
    }
    ctx.putImageData(frame, 0, 0);
  }

  requestAnimationFrame(renderLoop);
}

reloadBtn.addEventListener("click", loadData);
startBtn.addEventListener("click", startCamera);
loadData();
</script>

</body>
</html>
